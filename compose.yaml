name: pseudomarkets-nextgen-platform

services:
  aerospike:
    image: aerospike:ce-8.1.1.1_1
    container_name: pseudomarkets-nextgen-aerospike
    platform: linux/arm64
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v 'status' | grep -q '^ok$'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./.docker-data/aerospike:/opt/aerospike/data
      - ./infrastructure/aerospike/aerospike.conf:/opt/aerospike/etc/aerospike.conf:ro
    command:
      - "--config-file"
      - "/opt/aerospike/etc/aerospike.conf"
    restart: unless-stopped

  pseudomarkets.security.identityserver.web:
    image: pseudomarkets.security.identityserver.web
    build:
      context: .
      dockerfile: pseudomarkets-nextgen-idp/src/PseudoMarkets.Security.IdentityServer.Web/Dockerfile
    container_name: pseudomarkets-nextgen-idp-web
    env_file:
      - ./.env
    depends_on:
      aerospike:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Aerospike__Host: aerospike
      Aerospike__Port: 3000
      JwtConfiguration__Issuer: pseudomarkets-idp
      JwtConfiguration__Audience: pseudomarkets-platform
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pseudomarkets.marketdata.service:
    image: pseudomarkets.marketdata.service
    build:
      context: .
      dockerfile: pseudomarkets-nextgen-marketdata/src/PseudoMarkets.MarketData.Service/Dockerfile
    container_name: pseudomarkets-nextgen-marketdata-service
    env_file:
      - ./.env
    depends_on:
      aerospike:
        condition: service_healthy
      pseudomarkets.security.identityserver.web:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      Aerospike__Host: aerospike
      Aerospike__Port: 3000
      IdentityAuthorization__IdentityServerBaseUrl: http://pseudomarkets-nextgen-idp-web:8080
    ports:
      - "8081:8081"
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: pseudomarkets-nextgen-postgres
    environment:
      POSTGRES_DB: pseudomarkets_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${Postgres__Password:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pseudomarkets_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  pseudomarkets.transactionprocessing.service:
    image: pseudomarkets.transactionprocessing.service
    build:
      context: .
      dockerfile: pseudomarkets-nextgen-transaction-processing/src/PseudoMarkets.TransactionProcessing.Service/Dockerfile
    container_name: pseudomarkets-nextgen-transaction-processing-service
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      pseudomarkets.security.identityserver.web:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8082
      ConnectionStrings__PseudoMarketsDb: Host=postgres;Port=5432;Database=pseudomarkets_db;Username=postgres;Password=${Postgres__Password:-postgres}
      IdentityAuthorization__IdentityServerBaseUrl: http://pseudomarkets-nextgen-idp-web:8080
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F92' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pseudomarkets.tradinginstruments.service:
    image: pseudomarkets.tradinginstruments.service
    build:
      context: .
      dockerfile: pseudomarkets-nextgen-instrument-db/src/PseudoMarkets.ReferenceData.TradingInstruments.Service/Dockerfile
    container_name: pseudomarkets-nextgen-trading-instruments-service
    env_file:
      - ./.env
    depends_on:
      pseudomarkets.transactionprocessing.service:
        condition: service_healthy
      pseudomarkets.security.identityserver.web:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8083
      ConnectionStrings__PseudoMarketsDb: Host=postgres;Port=5432;Database=pseudomarkets_db;Username=postgres;Password=${Postgres__Password:-postgres}
      IdentityAuthorization__IdentityServerBaseUrl: http://pseudomarkets-nextgen-idp-web:8080
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F93' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  trading-instruments-seed:
    image: postgres:17
    container_name: pseudomarkets-nextgen-trading-instruments-seed
    depends_on:
      pseudomarkets.tradinginstruments.service:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pseudomarkets_db
      POSTGRES_USER: postgres
      PGPASSWORD: ${Postgres__Password:-postgres}
    volumes:
      - ./infrastructure/postgres/seed-trading-instruments.sh:/seed/seed-trading-instruments.sh:ro
      - ./infrastructure/postgres/trading-instruments:/seed/trading-instruments:ro
    command: ["sh", "/seed/seed-trading-instruments.sh"]
    restart: "no"

  pseudomarkets.orderexecution.service:
    image: pseudomarkets.orderexecution.service
    build:
      context: .
      dockerfile: pseudomarkets-nextgen-order-execution/src/PseudoMarkets.OrderExecution.Service/Dockerfile
    container_name: pseudomarkets-nextgen-order-execution-service
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      pseudomarkets.security.identityserver.web:
        condition: service_healthy
      pseudomarkets.marketdata.service:
        condition: service_started
      pseudomarkets.transactionprocessing.service:
        condition: service_healthy
      pseudomarkets.tradinginstruments.service:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8084
      ConnectionStrings__PseudoMarketsDb: Host=postgres;Port=5432;Database=pseudomarkets_db;Username=postgres;Password=${Postgres__Password:-postgres}
      IdentityAuthorization__IdentityServerBaseUrl: http://pseudomarkets-nextgen-idp-web:8080
      OrderExecution__TradingInstrumentsBaseUrl: http://pseudomarkets-nextgen-trading-instruments-service:8083
      OrderExecution__MarketDataBaseUrl: http://pseudomarkets-nextgen-marketdata-service:8081
      OrderExecution__TransactionProcessingBaseUrl: http://pseudomarkets-nextgen-transaction-processing-service:8082
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F94' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pseudomarkets.platform.batch.host:
    image: pseudomarkets.platform.batch.host
    build:
      context: .
      dockerfile: pseudomarkets-nextgen-batch-processing/src/PseudoMarkets.Platform.Batch.Host/Dockerfile
    container_name: pseudomarkets-nextgen-batch-processing-host
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      pseudomarkets.security.identityserver.web:
        condition: service_healthy
      pseudomarkets.orderexecution.service:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8085
      ConnectionStrings__PseudoMarketsDb: Host=postgres;Port=5432;Database=pseudomarkets_db;Username=postgres;Password=${Postgres__Password:-postgres}
      QueuedOrderExecution__IdentityServerBaseUrl: http://pseudomarkets-nextgen-idp-web:8080
      QueuedOrderExecution__OrderExecutionBaseUrl: http://pseudomarkets-nextgen-order-execution-service:8084
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F95' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
