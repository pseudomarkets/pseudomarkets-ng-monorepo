# CI for pseudomarkets monorepo: build, unit tests, integration tests
# Builds the solution, caches NuGet, runs unit tests, runs integration tests
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  SOLUTION_PATH: './PseudoMarkets.NextGen.Platform.sln' # detected solution file in repo root

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [10.0]
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
            ~/.dotnet/tools
          key: nuget-${{ matrix.dotnet-version }}-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            nuget-${{ matrix.dotnet-version }}-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $SOLUTION_PATH

      - name: Build
        run: dotnet build $SOLUTION_PATH --no-restore -c Release

      - name: Run unit tests
        # Adjust filter if you use a different trait for integration tests
        run: |
          dotnet test $SOLUTION_PATH --verbosity:minimal --logger "trx;LogFileName=unittests.trx" --filter "Category!=Integration"
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/unittests.trx'
